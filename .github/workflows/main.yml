name: NetApp.ontap Ansible CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * *'

jobs:
  sanity:
    name: Sanity (ansible-core ${{ matrix.ansible }} on ONTAP)
    # Python 3.9 target checks need a setup-python build available on this LTS.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ansible:
          - '2.21.6'
          - '2.22.0'

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          # Preserve compile/import coverage for every supported target Python.
          # The last entry remains the controller used to install ansible-core.
          python-version: |
            3.9
            3.10
            3.11
            3.12
            3.14
            3.15
            3.13

      - name: Install ansible (${{ matrix.ansible }})
        run: python -m pip install 'ansible-core==${{ matrix.ansible }}' --disable-pip-version-check

      - name: Make directory to make ansible-test happy
        run: |
          pwd
          mkdir -p ansible_collections/netapp/ontap/
          rsync -av . ansible_collections/netapp/ontap/ --exclude ansible_collections/netapp/ontap/


      - name: Run sanity tests ONTAP
        run: ansible-test sanity --local --requirements -v --color
        working-directory: ansible_collections/netapp/ontap/

      - name: Run Unit Tests
        run: ansible-test units --local --requirements --num-workers 2 -v --color --python 3.13
        working-directory: ansible_collections/netapp/ontap/
