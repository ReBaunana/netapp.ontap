name: NetApp.ontap Ansible Coverage

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * *'

jobs:
  sanity:
    name: Coverage on ONTAP
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'

      - name: Install the qualified stable ansible-core
        run: python -m pip install ansible-core==2.22.0 --disable-pip-version-check

      - name: Make directory to make ansible-test happy
        run: |
          pwd
          mkdir -p ansible_collections/netapp/ontap/
          rsync -av . ansible_collections/netapp/ontap/ --exclude ansible_collections/netapp/ontap/

      - name: Run Unit Tests
        run: ansible-test units --coverage --color --docker --python 3.13
        working-directory: ansible_collections/netapp/ontap/

        # ansible-test support producing code coverage date
      - name: Generate coverage report
        run: ansible-test coverage xml -v --requirements --group-by command --group-by version
        working-directory: ansible_collections/netapp/ontap/

      - name: Retain coverage in GitHub without third-party credentials
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ansible-core-2.22-python-3.13-coverage
          path: ansible_collections/netapp/ontap/tests/output/reports/*.xml
          if-no-files-found: error
          retention-days: 30
